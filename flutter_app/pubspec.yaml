name: accident_alert_app

description: >
  Accident Detection and Alert System
  using Raspberry Pi, MPU6050, NEO-6M GPS
  and Flutter.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  geolocator: ^9.0.2
  http: ^1.2.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
